services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      PORT: "8080"
    volumes:
      - data:/data
    networks:
      - petclinixnet

  # Optional: java-springboot-react-mtier's React frontend, pointed at this
  # backend to exercise the pet-picture wire-contract compatibility called
  # out in PLAN.md §9. Not started by a plain `docker compose up` — only
  # with `docker compose --profile frontend up --build`. The frontend image
  # calls relative `/api/...` paths (no configurable API base URL), so it
  # needs the `ingress` reverse proxy below in front of it rather than being
  # reachable directly.
  frontend:
    image: ghcr.io/petclinix/react-frontend:latest
    profiles:
      - frontend
    networks:
      - petclinixnet

  ingress:
    image: nginx:1.27-alpine
    profiles:
      - frontend
    ports:
      - "8090:80"
    volumes:
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - frontend
    networks:
      - petclinixnet

volumes:
  data:

networks:
  petclinixnet:
    driver: bridge
