[package]
name = "rust-axum-vslice"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
time = { version = "0.3", features = ["serde-well-known", "serde-human-readable", "parsing", "formatting"] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = "9"
thiserror = "2"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
time = { version = "0.3", features = ["macros"] }
# No TLS backend feature: black-box tests only ever hit a `127.0.0.1` test
# server over plain HTTP, so pulling in native-tls/rustls would just add
# build weight (and a system OpenSSL dependency) for nothing.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
